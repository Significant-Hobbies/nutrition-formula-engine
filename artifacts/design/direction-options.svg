<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120"><defs><linearGradient id="page" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e9edf1"/><stop offset="1" stop-color="#dce3e9"/></linearGradient><linearGradient id="spectrum" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#a7f3d0"/><stop offset=".48" stop-color="#fce7f3"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient><linearGradient id="amber" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#36280b"/><stop offset="1" stop-color="#1a1508"/></linearGradient><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="18" flood-color="#64748b" flood-opacity=".2" stdDeviation="18"/></filter><filter id="key" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="6" flood-color="#000" flood-opacity=".34" stdDeviation="4"/></filter><style>.ui{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.small{font-size:14px;letter-spacing:.08em;text-transform:uppercase}.label{font-size:15px;font-weight:650}.body{font-size:17px}.metric{font-size:26px;font-weight:720}.title{font-size:32px;font-weight:760;letter-spacing:-.03em}</style></defs><rect width="1800" height="1120" fill="url(#page)"/><g class="ui"><text x="48" y="54" fill="#475569" font-size="16" font-weight="700" letter-spacing=".14em">FORMULA COMPOSITION ENGINE · DIRECTION ROUND</text><text x="48" y="98" fill="#0f172a" font-size="34" font-weight="760" letter-spacing="-.035em">One formula in. A traceable composition report out.</text><text x="48" y="126" fill="#64748b" font-size="17">All three use the same single-input workflow. The difference is how evidence, uncertainty and corrections feel.</text><g filter="url(#shadow)" transform="translate(40 162)"><rect width="550" height="900" fill="#fbfcfd" rx="28"/><rect width="550" height="8" fill="url(#spectrum)" rx="4"/><text x="30" y="52" fill="#64748b" class="small">Direction A</text><text x="30" y="90" fill="#15202b" class="title">Assay Spectrum</text><text x="30" y="118" fill="#64748b" class="body">Quiet clinical workspace with uncertainty at the edge.</text><rect width="490" height="166" x="30" y="148" fill="#fff" stroke="#cbd5e1" stroke-width="2" rx="18"/><rect width="6" height="164" x="31" y="149" fill="url(#spectrum)" rx="3"/><text x="58" y="185" fill="#334155" class="label">Paste a formula or drop one file</text><text x="58" y="215" fill="#64748b" class="body">Spreadsheet · CSV · PDF · image · copied table</text><rect width="180" height="44" x="58" y="242" fill="#5b4fcf" rx="22"/><text x="92" y="270" fill="#fff" class="label">Choose formula</text><text x="264" y="270" fill="#5b4fcf" class="label">or paste here</text><text x="30" y="354" fill="#64748b" class="small">Parsed batch · 1,000 L</text><g transform="translate(30 374)"><rect width="490" height="82" fill="#f1f5f9" rx="14"/><text x="18" y="31" fill="#1e293b" class="label">Ferric ammonium citrate</text><text x="472" y="31" fill="#1e293b" class="mono" font-size="16" text-anchor="end">13.4 kg</text><text x="18" y="60" fill="#64748b" font-size="14">Brown grade assumed · review assay</text><rect width="109" height="20" x="363" y="48" fill="#fef3c7" rx="10"/><text x="417" y="62" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">ASSUMPTION</text></g><g transform="translate(30 466)"><rect width="490" height="82" fill="#f1f5f9" rx="14"/><text x="18" y="31" fill="#1e293b" class="label">NEPAZENE</text><text x="472" y="31" fill="#1e293b" class="mono" font-size="16" text-anchor="end">1 kg</text><text x="18" y="60" fill="#64748b" font-size="14">Likely Nipazine · 2 alternatives available</text><circle cx="461" cy="58" r="7" fill="#a78bfa"/></g><text x="30" y="590" fill="#64748b" class="small">Result preview · per 100 mL</text><text x="30" y="635" fill="#15202b" class="metric">261.3 mg</text><text x="168" y="635" fill="#64748b" class="body">iron nominal</text><rect width="490" height="13" x="30" y="654" fill="#e2e8f0" rx="6.5"/><rect width="316" height="13" x="118" y="654" fill="url(#spectrum)" rx="6.5"/><circle cx="315" cy="660.5" r="8" fill="#5b4fcf" stroke="#fff" stroke-width="3"/><text x="30" y="691" fill="#64748b" font-size="14">Range 194.3–301.5 mg · grade-dependent</text><g transform="translate(30 724)"><rect width="235" height="94" fill="#eefbf7" rx="16"/><text x="18" y="29" fill="#047857" class="small">Arithmetic evidence</text><text x="18" y="62" fill="#064e3b" class="metric">0.244%</text><text x="18" y="82" fill="#047857" font-size="13">mean public-test error</text></g><g transform="translate(285 724)"><rect width="235" height="94" fill="#faf5ff" rx="16"/><text x="18" y="29" fill="#7e22ce" class="small">Needs review</text><text x="18" y="62" fill="#581c87" class="metric">8 items</text><text x="18" y="82" fill="#7e22ce" font-size="13">named, never hidden</text></g><rect width="490" height="42" x="30" y="840" fill="#15202b" rx="21"/><text x="275" y="867" fill="#fff" class="label" text-anchor="middle">Review parsed formula →</text></g><g filter="url(#shadow)" transform="translate(625 162)"><rect width="550" height="900" fill="#202326" rx="28"/><rect width="514" height="864" x="18" y="18" fill="#2b3034" stroke="#464d51" rx="20"/><text x="40" y="58" fill="#b8ad98" class="small">Direction B</text><text x="40" y="96" fill="#f1eadc" class="title">Instrument Bench</text><text x="40" y="124" fill="#aba596" class="body">Tactile batch console with one unmistakable commit action.</text><rect width="470" height="118" x="40" y="152" fill="url(#amber)" stroke="#6e581e" rx="12"/><text x="62" y="185" fill="#e5b94e" class="mono small">FORMULA INPUT / READY</text><text x="62" y="220" fill="#ffd66b" class="mono" font-size="22">13 INGREDIENTS · 1,000 L</text><text x="62" y="248" fill="#c99d38" class="mono" font-size="14">PASTE TABLE OR DROP FILE</text><g transform="translate(40 300)"><rect width="148" height="86" fill="#ddd5c6" filter="url(#key)" rx="12"/><text x="16" y="29" fill="#4b4945" class="mono small">INPUT</text><text x="16" y="60" fill="#262626" class="mono" font-size="17">PASTE</text></g><g transform="translate(201 300)"><rect width="148" height="86" fill="#cbc3b6" filter="url(#key)" rx="12"/><text x="16" y="29" fill="#4b4945" class="mono small">INPUT</text><text x="16" y="60" fill="#262626" class="mono" font-size="17">UPLOAD</text></g><g transform="translate(362 300)"><rect width="148" height="86" fill="#f26a2e" filter="url(#key)" rx="12"/><text x="16" y="29" fill="#5a1f09" class="mono small">RUN</text><text x="16" y="60" fill="#351207" class="mono" font-size="17" font-weight="800">ANALYZE</text></g><text x="40" y="434" fill="#b8ad98" class="mono small">BATCH CHANNELS</text><g transform="translate(40 454)"><rect width="470" height="70" fill="#373d41" stroke="#4c5459" rx="9"/><circle cx="26" cy="35" r="8" fill="#e3b341"/><text x="48" y="29" fill="#f1eadc" class="mono" font-size="16">FERRIC AMMONIUM CITRATE</text><text x="448" y="29" fill="#f1eadc" class="mono" font-size="16" text-anchor="end">13.4 KG</text><text x="48" y="52" fill="#aaa493" class="mono" font-size="12">ASSAY RANGE ARMED</text></g><g transform="translate(40 536)"><rect width="470" height="70" fill="#373d41" stroke="#4c5459" rx="9"/><circle cx="26" cy="35" r="8" fill="#f26a2e"/><text x="48" y="29" fill="#f1eadc" class="mono" font-size="16">NEPAZENE</text><text x="448" y="29" fill="#f1eadc" class="mono" font-size="16" text-anchor="end">1.0 KG</text><text x="48" y="52" fill="#f6a37e" class="mono" font-size="12">IDENTITY SWITCH REQUIRED</text></g><rect width="470" height="132" x="40" y="638" fill="#171a1c" stroke="#596168" rx="12"/><text x="62" y="672" fill="#9ea6aa" class="mono small">LIVE OUTPUT / PER 100 ML</text><text x="62" y="718" fill="#ffd66b" class="mono" font-size="35">IRON 261.3 MG</text><text x="62" y="748" fill="#b6bdc0" class="mono" font-size="14">WINDOW 194.3 — 301.5</text><g transform="translate(40 798)"><rect width="148" height="64" fill="#ddd5c6" rx="9"/><text x="15" y="27" fill="#55514b" class="mono small">TRACE</text><text x="15" y="49" fill="#262626" class="mono" font-size="14">SOURCES</text></g><g transform="translate(201 798)"><rect width="148" height="64" fill="#ddd5c6" rx="9"/><text x="15" y="27" fill="#55514b" class="mono small">EXPORT</text><text x="15" y="49" fill="#262626" class="mono" font-size="14">REPORT</text></g><g transform="translate(362 798)"><rect width="148" height="64" fill="#554536" rx="9"/><text x="15" y="27" fill="#e3b341" class="mono small">STATE</text><text x="15" y="49" fill="#f1eadc" class="mono" font-size="14">DRAFT</text></g></g><g filter="url(#shadow)" transform="translate(1210 162)"><rect width="550" height="900" fill="#fff" rx="28"/><text x="34" y="52" fill="#1d4ed8" class="small">Direction C · conventional</text><text x="34" y="90" fill="#111827" class="title">Clear Compliance Desk</text><text x="34" y="118" fill="#6b7280" class="body">Familiar B2B form-and-table workflow with restrained styling.</text><rect width="482" height="202" x="34" y="148" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="8 6" rx="12"/><circle cx="275" cy="202" r="28" fill="#dbeafe"/><path stroke="#2563eb" stroke-linecap="round" stroke-width="3" d="M275 188v30M260 203h30"/><text x="275" y="252" fill="#1f2937" class="label" text-anchor="middle">Add one formula</text><text x="275" y="280" fill="#6b7280" class="body" text-anchor="middle">Drop a file or paste a table</text><rect width="186" height="34" x="182" y="300" fill="#2563eb" rx="7"/><text x="275" y="322" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Select formula</text><text x="34" y="394" fill="#6b7280" class="small">Review extracted rows</text><rect width="482" height="228" x="34" y="414" fill="#fff" stroke="#d1d5db" rx="10"/><rect width="482" height="42" x="34" y="414" fill="#f3f4f6" rx="10"/><text x="50" y="441" fill="#4b5563" font-size="13" font-weight="700">INGREDIENT</text><text x="482" y="441" fill="#4b5563" font-size="13" font-weight="700" text-anchor="end">QUANTITY</text><line x1="34" x2="516" y1="456" y2="456" stroke="#e5e7eb"/><text x="50" y="490" fill="#1f2937" class="label">Ferric ammonium citrate</text><text x="482" y="490" fill="#1f2937" class="mono" font-size="15" text-anchor="end">13.4 kg</text><line x1="50" x2="500" y1="510" y2="510" stroke="#e5e7eb"/><text x="50" y="545" fill="#1f2937" class="label">NEPAZENE</text><text x="482" y="545" fill="#1f2937" class="mono" font-size="15" text-anchor="end">1 kg</text><rect width="148" height="24" x="50" y="563" fill="#fee2e2" rx="12"/><text x="124" y="579" fill="#991b1b" font-size="11" font-weight="700" text-anchor="middle">SELECT IDENTITY</text><line x1="50" x2="500" y1="606" y2="606" stroke="#e5e7eb"/><text x="50" y="629" fill="#6b7280" font-size="13">11 more ingredients</text><text x="34" y="688" fill="#6b7280" class="small">Key result</text><rect width="482" height="92" x="34" y="708" fill="#eff6ff" rx="10"/><text x="54" y="739" fill="#1e40af" class="label">Iron per 100 mL</text><text x="54" y="778" fill="#1e3a8a" class="metric">261.3 mg</text><text x="488" y="778" fill="#1d4ed8" font-size="14" text-anchor="end">194.3–301.5 mg</text><rect width="232" height="48" x="34" y="824" fill="#fff" stroke="#9ca3af" rx="8"/><text x="150" y="854" fill="#374151" class="label" text-anchor="middle">Save draft</text><rect width="232" height="48" x="284" y="824" fill="#2563eb" rx="8"/><text x="400" y="854" fill="#fff" class="label" text-anchor="middle">Generate report</text></g></g></svg>