<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9edf1"/>
      <stop offset="1" stop-color="#dce3e9"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a7f3d0"/>
      <stop offset="0.48" stop-color="#fce7f3"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36280b"/>
      <stop offset="1" stop-color="#1a1508"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#64748b" flood-opacity="0.2"/>
    </filter>
    <filter id="key" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.34"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .small { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
      .label { font-size: 15px; font-weight: 650; }
      .body { font-size: 17px; }
      .metric { font-size: 26px; font-weight: 720; }
      .title { font-size: 32px; font-weight: 760; letter-spacing: -.03em; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#page)"/>
  <g class="ui">
    <text x="48" y="54" font-size="16" font-weight="700" fill="#475569" letter-spacing=".14em">FORMULA COMPOSITION ENGINE · DIRECTION ROUND</text>
    <text x="48" y="98" font-size="34" font-weight="760" fill="#0f172a" letter-spacing="-.035em">One formula in. A traceable composition report out.</text>
    <text x="48" y="126" font-size="17" fill="#64748b">All three use the same single-input workflow. The difference is how evidence, uncertainty and corrections feel.</text>

    <!-- Direction A -->
    <g transform="translate(40 162)" filter="url(#shadow)">
      <rect width="550" height="900" rx="28" fill="#fbfcfd"/>
      <rect width="550" height="8" rx="4" fill="url(#spectrum)"/>
      <text x="30" y="52" class="small" fill="#64748b">Direction A</text>
      <text x="30" y="90" class="title" fill="#15202b">Assay Spectrum</text>
      <text x="30" y="118" class="body" fill="#64748b">Quiet clinical workspace with uncertainty at the edge.</text>

      <rect x="30" y="148" width="490" height="166" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="31" y="149" width="6" height="164" rx="3" fill="url(#spectrum)"/>
      <text x="58" y="185" class="label" fill="#334155">Paste a formula or drop one file</text>
      <text x="58" y="215" class="body" fill="#64748b">Spreadsheet · CSV · PDF · image · copied table</text>
      <rect x="58" y="242" width="180" height="44" rx="22" fill="#5b4fcf"/>
      <text x="92" y="270" class="label" fill="#fff">Choose formula</text>
      <text x="264" y="270" class="label" fill="#5b4fcf">or paste here</text>

      <text x="30" y="354" class="small" fill="#64748b">Parsed batch · 1,000 L</text>
      <g transform="translate(30 374)">
        <rect width="490" height="82" rx="14" fill="#f1f5f9"/>
        <text x="18" y="31" class="label" fill="#1e293b">Ferric ammonium citrate</text>
        <text x="472" y="31" text-anchor="end" class="mono" font-size="16" fill="#1e293b">13.4 kg</text>
        <text x="18" y="60" font-size="14" fill="#64748b">Brown grade assumed · review assay</text>
        <rect x="363" y="48" width="109" height="20" rx="10" fill="#fef3c7"/>
        <text x="417" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">ASSUMPTION</text>
      </g>
      <g transform="translate(30 466)">
        <rect width="490" height="82" rx="14" fill="#f1f5f9"/>
        <text x="18" y="31" class="label" fill="#1e293b">NEPAZENE</text>
        <text x="472" y="31" text-anchor="end" class="mono" font-size="16" fill="#1e293b">1 kg</text>
        <text x="18" y="60" font-size="14" fill="#64748b">Likely Nipazine · 2 alternatives available</text>
        <circle cx="461" cy="58" r="7" fill="#a78bfa"/>
      </g>

      <text x="30" y="590" class="small" fill="#64748b">Result preview · per 100 mL</text>
      <text x="30" y="635" class="metric" fill="#15202b">261.3 mg</text>
      <text x="168" y="635" class="body" fill="#64748b">iron nominal</text>
      <rect x="30" y="654" width="490" height="13" rx="6.5" fill="#e2e8f0"/>
      <rect x="118" y="654" width="316" height="13" rx="6.5" fill="url(#spectrum)"/>
      <circle cx="315" cy="660.5" r="8" fill="#5b4fcf" stroke="#fff" stroke-width="3"/>
      <text x="30" y="691" font-size="14" fill="#64748b">Range 194.3–301.5 mg · grade-dependent</text>

      <g transform="translate(30 724)">
        <rect width="235" height="94" rx="16" fill="#eefbf7"/>
        <text x="18" y="29" class="small" fill="#047857">Arithmetic evidence</text>
        <text x="18" y="62" class="metric" fill="#064e3b">0.244%</text>
        <text x="18" y="82" font-size="13" fill="#047857">mean public-test error</text>
      </g>
      <g transform="translate(285 724)">
        <rect width="235" height="94" rx="16" fill="#faf5ff"/>
        <text x="18" y="29" class="small" fill="#7e22ce">Needs review</text>
        <text x="18" y="62" class="metric" fill="#581c87">8 items</text>
        <text x="18" y="82" font-size="13" fill="#7e22ce">named, never hidden</text>
      </g>
      <rect x="30" y="840" width="490" height="42" rx="21" fill="#15202b"/>
      <text x="275" y="867" text-anchor="middle" class="label" fill="#fff">Review parsed formula →</text>
    </g>

    <!-- Direction B -->
    <g transform="translate(625 162)" filter="url(#shadow)">
      <rect width="550" height="900" rx="28" fill="#202326"/>
      <rect x="18" y="18" width="514" height="864" rx="20" fill="#2b3034" stroke="#464d51"/>
      <text x="40" y="58" class="small" fill="#b8ad98">Direction B</text>
      <text x="40" y="96" class="title" fill="#f1eadc">Instrument Bench</text>
      <text x="40" y="124" class="body" fill="#aba596">Tactile batch console with one unmistakable commit action.</text>

      <rect x="40" y="152" width="470" height="118" rx="12" fill="url(#amber)" stroke="#6e581e"/>
      <text x="62" y="185" class="mono small" fill="#e5b94e">FORMULA INPUT / READY</text>
      <text x="62" y="220" class="mono" font-size="22" fill="#ffd66b">13 INGREDIENTS · 1,000 L</text>
      <text x="62" y="248" class="mono" font-size="14" fill="#c99d38">PASTE TABLE OR DROP FILE</text>

      <g transform="translate(40 300)">
        <rect width="148" height="86" rx="12" fill="#ddd5c6" filter="url(#key)"/>
        <text x="16" y="29" class="mono small" fill="#4b4945">INPUT</text>
        <text x="16" y="60" class="mono" font-size="17" fill="#262626">PASTE</text>
      </g>
      <g transform="translate(201 300)">
        <rect width="148" height="86" rx="12" fill="#cbc3b6" filter="url(#key)"/>
        <text x="16" y="29" class="mono small" fill="#4b4945">INPUT</text>
        <text x="16" y="60" class="mono" font-size="17" fill="#262626">UPLOAD</text>
      </g>
      <g transform="translate(362 300)">
        <rect width="148" height="86" rx="12" fill="#f26a2e" filter="url(#key)"/>
        <text x="16" y="29" class="mono small" fill="#5a1f09">RUN</text>
        <text x="16" y="60" class="mono" font-size="17" font-weight="800" fill="#351207">ANALYZE</text>
      </g>

      <text x="40" y="434" class="mono small" fill="#b8ad98">BATCH CHANNELS</text>
      <g transform="translate(40 454)">
        <rect width="470" height="70" rx="9" fill="#373d41" stroke="#4c5459"/>
        <circle cx="26" cy="35" r="8" fill="#e3b341"/>
        <text x="48" y="29" class="mono" font-size="16" fill="#f1eadc">FERRIC AMMONIUM CITRATE</text>
        <text x="448" y="29" text-anchor="end" class="mono" font-size="16" fill="#f1eadc">13.4 KG</text>
        <text x="48" y="52" class="mono" font-size="12" fill="#aaa493">ASSAY RANGE ARMED</text>
      </g>
      <g transform="translate(40 536)">
        <rect width="470" height="70" rx="9" fill="#373d41" stroke="#4c5459"/>
        <circle cx="26" cy="35" r="8" fill="#f26a2e"/>
        <text x="48" y="29" class="mono" font-size="16" fill="#f1eadc">NEPAZENE</text>
        <text x="448" y="29" text-anchor="end" class="mono" font-size="16" fill="#f1eadc">1.0 KG</text>
        <text x="48" y="52" class="mono" font-size="12" fill="#f6a37e">IDENTITY SWITCH REQUIRED</text>
      </g>

      <rect x="40" y="638" width="470" height="132" rx="12" fill="#171a1c" stroke="#596168"/>
      <text x="62" y="672" class="mono small" fill="#9ea6aa">LIVE OUTPUT / PER 100 ML</text>
      <text x="62" y="718" class="mono" font-size="35" fill="#ffd66b">IRON 261.3 MG</text>
      <text x="62" y="748" class="mono" font-size="14" fill="#b6bdc0">WINDOW 194.3 — 301.5</text>

      <g transform="translate(40 798)">
        <rect width="148" height="64" rx="9" fill="#ddd5c6"/>
        <text x="15" y="27" class="mono small" fill="#55514b">TRACE</text>
        <text x="15" y="49" class="mono" font-size="14" fill="#262626">SOURCES</text>
      </g>
      <g transform="translate(201 798)">
        <rect width="148" height="64" rx="9" fill="#ddd5c6"/>
        <text x="15" y="27" class="mono small" fill="#55514b">EXPORT</text>
        <text x="15" y="49" class="mono" font-size="14" fill="#262626">REPORT</text>
      </g>
      <g transform="translate(362 798)">
        <rect width="148" height="64" rx="9" fill="#554536"/>
        <text x="15" y="27" class="mono small" fill="#e3b341">STATE</text>
        <text x="15" y="49" class="mono" font-size="14" fill="#f1eadc">DRAFT</text>
      </g>
    </g>

    <!-- Direction C -->
    <g transform="translate(1210 162)" filter="url(#shadow)">
      <rect width="550" height="900" rx="28" fill="#ffffff"/>
      <text x="34" y="52" class="small" fill="#1d4ed8">Direction C · conventional</text>
      <text x="34" y="90" class="title" fill="#111827">Clear Compliance Desk</text>
      <text x="34" y="118" class="body" fill="#6b7280">Familiar B2B form-and-table workflow with restrained styling.</text>

      <rect x="34" y="148" width="482" height="202" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="8 6"/>
      <circle cx="275" cy="202" r="28" fill="#dbeafe"/>
      <path d="M275 188v30M260 203h30" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
      <text x="275" y="252" text-anchor="middle" class="label" fill="#1f2937">Add one formula</text>
      <text x="275" y="280" text-anchor="middle" class="body" fill="#6b7280">Drop a file or paste a table</text>
      <rect x="182" y="300" width="186" height="34" rx="7" fill="#2563eb"/>
      <text x="275" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Select formula</text>

      <text x="34" y="394" class="small" fill="#6b7280">Review extracted rows</text>
      <rect x="34" y="414" width="482" height="228" rx="10" fill="#fff" stroke="#d1d5db"/>
      <rect x="34" y="414" width="482" height="42" rx="10" fill="#f3f4f6"/>
      <text x="50" y="441" font-size="13" font-weight="700" fill="#4b5563">INGREDIENT</text>
      <text x="482" y="441" text-anchor="end" font-size="13" font-weight="700" fill="#4b5563">QUANTITY</text>
      <line x1="34" y1="456" x2="516" y2="456" stroke="#e5e7eb"/>
      <text x="50" y="490" class="label" fill="#1f2937">Ferric ammonium citrate</text>
      <text x="482" y="490" text-anchor="end" class="mono" font-size="15" fill="#1f2937">13.4 kg</text>
      <line x1="50" y1="510" x2="500" y2="510" stroke="#e5e7eb"/>
      <text x="50" y="545" class="label" fill="#1f2937">NEPAZENE</text>
      <text x="482" y="545" text-anchor="end" class="mono" font-size="15" fill="#1f2937">1 kg</text>
      <rect x="50" y="563" width="148" height="24" rx="12" fill="#fee2e2"/>
      <text x="124" y="579" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">SELECT IDENTITY</text>
      <line x1="50" y1="606" x2="500" y2="606" stroke="#e5e7eb"/>
      <text x="50" y="629" font-size="13" fill="#6b7280">11 more ingredients</text>

      <text x="34" y="688" class="small" fill="#6b7280">Key result</text>
      <rect x="34" y="708" width="482" height="92" rx="10" fill="#eff6ff"/>
      <text x="54" y="739" class="label" fill="#1e40af">Iron per 100 mL</text>
      <text x="54" y="778" class="metric" fill="#1e3a8a">261.3 mg</text>
      <text x="488" y="778" text-anchor="end" font-size="14" fill="#1d4ed8">194.3–301.5 mg</text>
      <rect x="34" y="824" width="232" height="48" rx="8" fill="#fff" stroke="#9ca3af"/>
      <text x="150" y="854" text-anchor="middle" class="label" fill="#374151">Save draft</text>
      <rect x="284" y="824" width="232" height="48" rx="8" fill="#2563eb"/>
      <text x="400" y="854" text-anchor="middle" class="label" fill="#fff">Generate report</text>
    </g>
  </g>
</svg>
