    <text x="24" y="656" font-family="Arial" font-size="10" fill="#222">Oral haematinic syrup</text><text x="220" y="656" font-family="monospace" font-size="10" fill="#222">04</text><text x="300" y="656" font-family="Arial" font-size="10" fill="#222">21 Sep 2026</text>
